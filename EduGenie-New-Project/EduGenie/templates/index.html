<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGenie - Learning Assistant</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">AI-POWERED LEARNING</p>
        <h1>EduGenie</h1>
        <p class="subtitle">Learn clearly. Practice intelligently. Study at your pace.</p>
      </div>
      <div class="spark">✦</div>
    </section>

    <section class="card">
      <label for="task">Choose a task</label>
      <select id="task">
        <option value="qa">Ask a Question</option>
        <option value="explain">Explain a Topic</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize Text</option>
        <option value="learn">Recommend Learning Path</option>
      </select>

      <label for="inputText">Your input</label>
      <textarea id="inputText" rows="10"
        placeholder="Example: Explain the water cycle in simple English."></textarea>

      <button id="submitBtn">Generate</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="resultCard" class="card result-card hidden">
      <h2>Result</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
